name: edith-weekly-build
on:
  schedule:
    - cron: '0 15 * * 3'   # Wednesday 15:00 UTC (matches Hermes edith-weekly-build)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run weekly build
        run: python scripts/edith_weekly_build.py
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Commit state
        run: |
          git config user.name "edith-bot"
          git config user.email "edith-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "no state changes"; else git commit -m "state: weekly-build $(date -u +%Y%m%dT%H%M%SZ)" && git push; fi
