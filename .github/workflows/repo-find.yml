name: edith-repo-find
on:
  schedule:
    - cron: '0 13 * * *'   # daily 1pm UTC (matches Hermes edith-repo-find)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run curator
        run: python scripts/edith_curator.py
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Commit state
        run: |
          git config user.name "edith-bot"
          git config user.email "edith-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "no state changes"; else git commit -m "state: repo-find $(date -u +%Y%m%dT%H%M%SZ)" && git push; fi
